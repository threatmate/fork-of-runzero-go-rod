version: 2
updates:
- package-ecosystem: gomod
  cooldown:
    default-days: 7
  directory: "/"
  schedule:
    interval: daily
    time: "10:00"
  open-pull-requests-limit: 10
  target-branch: main
  groups:
    dev-dependencies:
      patterns:
        - "*" 
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
        - "*"
  open-pull-requests-limit: 5
